[package]
name = "chome"
version = "0.1.1"
edition = "2024"
description = "Trình duyệt web nhẹ cho Linux, giao diện như Chrome (Rust + GTK4 + WebKitGTK)"
license = "Unlicense"
repository = "https://github.com/LILLINH/chome"

[workspace]
members = [".", "chome-mcp"]

[dependencies]
gtk4 = { version = "0.11", features = ["v4_12"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde_json = "1"
webkit6 = { version = "0.6", features = ["v2_42"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
